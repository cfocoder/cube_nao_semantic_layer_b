# Formal scenario B: direct PostgreSQL plus technical schema metadata.
# Secrets are supplied by the deployment environment, never committed here.
project_name: tesis-condition-b
databases:
  - name: direct_postgres
    type: postgres
    host: "{{ env('DIRECT_PG_HOST') }}"
    port: "{{ env('DIRECT_PG_PORT') }}"
    database: "{{ env('DIRECT_PG_DATABASE') }}"
    user: "{{ env('DIRECT_PG_USER') }}"
    password: "{{ env('DIRECT_PG_PASSWORD') }}"
    schema_name: retail
    include:
      - "retail.*"
    templates:
      - columns
      - preview

llm:
  providers:
    - provider: openai
      api_key: "{{ env('OPENAI_API_KEY') }}"
      base_url: "{{ env('OPENAI_BASE_URL') }}"
      models:
        - id: gpt-6-luna
          name: OpenAI - GPT-6 Luna
          default: true

    - provider: openrouter
      api_key: "{{ env('DEEPSEEK_API_KEY') }}"
      base_url: "https://api.deepseek.com"
      models:
        - id: deepseek-flash
          name: DeepSeek Flash
